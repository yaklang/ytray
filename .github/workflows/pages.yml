name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/v0.1.0/**"
      - "docs/images/v0.1.2/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy official website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install website dependencies
        working-directory: site
        run: npm ci
      - name: Assemble product assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/public/assets
          cp docs/images/v0.1.0/*.png site/public/assets/
          cp docs/images/v0.1.2/*.png site/public/assets/
          asset_count="$(find site/public/assets -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$asset_count" -ge 19
      - name: Build static Next.js website
        working-directory: site
        env:
          YTRAY_BASE_PATH: /ytray
          NEXT_PUBLIC_BASE_PATH: /ytray
        run: npm run build
      - name: Stamp immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg commit "$GITHUB_SHA" --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{product:"ytray",commit:$commit,deployed_at:$deployed_at}' > site/out/deploy-meta.json
          test -f site/out/index.html
          grep -F '为测试与研发而生的' site/out/index.html >/dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed commit
        shell: bash
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 18); do
            if curl --retry 2 --retry-all-errors -fsSL "${page_url}deploy-meta.json?sha=$GITHUB_SHA" \
              | jq -e --arg sha "$GITHUB_SHA" '.product == "ytray" and .commit == $sha' >/dev/null; then
              curl --retry 2 --retry-all-errors -fsSL "$page_url" | grep -F '为测试与研发而生的' >/dev/null
              exit 0
            fi
            sleep 5
          done
          exit 1
