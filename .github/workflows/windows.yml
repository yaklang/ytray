name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test, capture, package
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build, test, and package amd64
        shell: pwsh
        run: ./windows/build.ps1 -Release -Test -Package -Installer -Architecture amd64

      - name: Verify standalone executable and bundled latest plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $exe = "windows/artifacts/amd64/YTray-$version-windows-amd64.exe"
          $marker = Join-Path $env:RUNNER_TEMP 'standalone-ok.json'
          $process = Start-Process $exe -ArgumentList @('--verify-standalone', ('"' + $marker + '"')) -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Standalone smoke timed out.' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Standalone verification failed.' }
          $verification = Get-Content $marker -Raw | ConvertFrom-Json
          $bundled = Get-Content windows/src/Assets/BundledExtension/bundled-extension.json -Raw | ConvertFrom-Json
          if ($verification.bundledExtensionVersion -ne $bundled.version) { throw 'Bundled plugin version mismatch.' }

      - name: Capture Windows design review
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $exe = "windows/artifacts/amd64/YTray-$version-windows-amd64.exe"
          $capture = Join-Path $env:RUNNER_TEMP 'ytray-design-review'
          $process = Start-Process $exe -ArgumentList @('--capture-design-review', ('"' + $capture + '"')) -PassThru
          if (-not $process.WaitForExit(300000)) {
            $process.Kill()
            Get-ChildItem $capture -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
            throw 'Design capture timed out after five minutes.'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $capture 'capture-complete.txt'))) {
            throw 'Design capture failed.'
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytray-windows-ci
          path: |
            windows/artifacts/amd64/YTray-*-windows-amd64-setup.exe
            ${{ runner.temp }}/ytray-design-review/**
          if-no-files-found: error
          retention-days: 14
