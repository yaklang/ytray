name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Optional published release for startup investigation (e.g. v0.2.2)
        default: ''

permissions:
  contents: read

concurrency:
  group: darwin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test, UI smoke, package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select OpenSSL 3 for Ed25519 tests
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.build|DerivedData)(/|$)|\.app/|\.(dmg|zip)$'; then
            echo "Tracked build artifact detected" >&2
            exit 1
          fi
          bash -n script/*.sh
          python3 script/verify-app-icons.py

      - name: Run release metadata tests
        run: |
          bash script/test-release-index.sh
          python3 -m unittest discover -s script/tests -v

      - name: Build and test macOS application
        run: |
          swift --version
          swift build --package-path darwin --configuration release
          swift test --package-path darwin

      - name: Verify native Sparkle rejection, replacement and relaunch
        run: python3 script/test-macos-updater.py

      - name: Render real UI previews
        shell: bash
        run: |
          set -euo pipefail
          bin_path="$(swift build --package-path darwin --configuration release --show-bin-path)"
          bash script/render-macos-console.sh "$RUNNER_TEMP" "$bin_path/YTray"
          "$bin_path/YTray" --render-widget "$RUNNER_TEMP/ytray-widget.png" --running --history --proxy-advanced
          "$bin_path/YTray" --render-wizard "$RUNNER_TEMP/ytray-custom-launch.png"
          "$bin_path/YTray" --render-edge-dock "$RUNNER_TEMP/ytray-edge-dock.png"
          for image in "$RUNNER_TEMP"/ytray-*.png; do
            test -s "$image"
            sips -g pixelWidth -g pixelHeight "$image" >/dev/null
          done

      - name: Ensure ImageMagick
        run: command -v magick >/dev/null 2>&1 || brew install imagemagick

      - name: Exercise universal package with latest plugin
        run: ./script/package-macos.sh --arch universal --dmg

      - name: Test packaged application startup
        run: python3 script/test-macos-startup.py dist/darwin-universal/YTray.app --disposable-account --output "$RUNNER_TEMP/startup-evidence"

      - name: Verify mounted universal DMG
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="dist/YTray-$version-darwin-universal.dmg"
          mount_dir="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app="$mount_dir/YTray.app"
          test -x "$app/Contents/MacOS/YTray"
          test "$(lipo -archs "$app/Contents/MacOS/YTray" | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          unzip -t "$app/Contents/Resources/BundledExtension/yakit-browser-agent.zip" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytray-macos-ci-${{ matrix.os }}
          path: |
            dist/YTray-*-darwin-universal.dmg
            ${{ runner.temp }}/ytray-*.png
            ${{ runner.temp }}/startup-evidence
          if-no-files-found: error
          retention-days: 14

  published-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and mount signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/startup"
          gh release download "$RELEASE" --pattern "*darwin-$ARCH.dmg" --dir "$RUNNER_TEMP/startup"
          hdiutil attach "$RUNNER_TEMP"/startup/*.dmg -mountpoint "$RUNNER_TEMP/startup/mounted" -nobrowse -readonly
          ditto "$RUNNER_TEMP/startup/mounted/YTray.app" "$RUNNER_TEMP/startup/YTray.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/startup/YTray.app"
      - name: Exercise first launch and subsequent launch
        run: python3 script/test-macos-startup.py "$RUNNER_TEMP/startup/YTray.app" --disposable-account --output "$RUNNER_TEMP/startup/evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-${{ matrix.os }}
          path: ${{ runner.temp }}/startup/evidence
