name: macOS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: darwin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build macOS app
        run: swift build --package-path darwin

      - name: Run macOS tests
        run: swift test --package-path darwin
