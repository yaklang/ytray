name: macOS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: darwin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject build artifacts and obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.build|DerivedData)(/|$)|\.app/|\.(dmg|zip)$'; then
            echo "Tracked build or distribution artifact detected"
            exit 1
          fi
          if git grep -En 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|AccessKeySecret|x-oss-signature=' -- . ':(exclude).github/workflows/darwin.yml'; then
            echo "Potential credential material detected"
            exit 1
          fi

      - name: Verify public YTray branding and README assets
        shell: bash
        run: |
          set -euo pipefail
          legacy_prefix='instance'
          legacy_suffix='dock'
          if git grep -Ein "${legacy_prefix}[ -]?${legacy_suffix}|${legacy_prefix}_${legacy_suffix}" -- README.md windows script darwin .github; then
            echo "Legacy public brand detected"
            exit 1
          fi
          test -s docs/images/ytray-hero.png
          test -s docs/images/ytray-widget-history.png
          test -s docs/images/ytray-edge-actions.png
          test -s docs/images/ytray-edge-panel.png
          bash -n script/startup.sh

  build-and-test:
    name: macOS build, test, and UI smoke
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build release executable
        run: swift build --package-path darwin --configuration release

      - name: Run macOS tests
        run: swift test --package-path darwin

      - name: Render UI smoke previews
        shell: bash
        run: |
          set -euo pipefail
          bin_path="$(swift build --package-path darwin --configuration release --show-bin-path)"
          "$bin_path/YTray" --render-widget "$RUNNER_TEMP/ytray-widget.png" --running --history --proxy-advanced
          "$bin_path/YTray" --render-wizard "$RUNNER_TEMP/ytray-wizard.png"
          "$bin_path/YTray" --render-edge-dock "$RUNNER_TEMP/ytray-edge-dock.png"
          test -s "$RUNNER_TEMP/ytray-widget.png"
          test -s "$RUNNER_TEMP/ytray-wizard.png"
          test -s "$RUNNER_TEMP/ytray-edge-dock.png"
