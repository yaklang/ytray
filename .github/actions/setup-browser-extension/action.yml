name: Set up browser extension tools
description: Install Node.js and the pnpm version declared by the browser extension.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: browser-extension/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: browser-extension/pnpm-lock.yaml
