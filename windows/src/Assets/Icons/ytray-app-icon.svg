<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>YTray application icon</title>
  <desc>A central runtime hub coordinating three browser instances along a broken orbit.</desc>
  <defs>
    <linearGradient id="tile" x1="160" y1="112" x2="864" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24282D"/>
      <stop offset="0.52" stop-color="#191C20"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="orange" x1="320" y1="248" x2="716" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF862F"/>
      <stop offset="1" stop-color="#F26116"/>
    </linearGradient>
    <linearGradient id="ivory" x1="180" y1="190" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EEECE6"/>
    </linearGradient>
    <filter id="tileShadow" x="16" y="28" width="992" height="1012" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="symbolShadow" x="90" y="100" width="812" height="812" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="64" y="64" width="896" height="896" rx="196" fill="url(#tile)"/>
    <rect x="66" y="66" width="892" height="892" rx="194" stroke="#343940" stroke-width="4"/>
  </g>

  <g filter="url(#symbolShadow)">
    <circle cx="500" cy="512" r="292" stroke="url(#ivory)" stroke-width="38"
            stroke-linecap="round" stroke-dasharray="390 221" transform="rotate(-17 500 512)"/>

    <path d="M500 512L210 512M500 512L650 260M500 512L672 744"
          stroke="url(#orange)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="500" cy="512" r="108" fill="url(#orange)"/>

    <g>
      <rect x="118" y="427" width="184" height="170" rx="48" fill="url(#orange)"/>
      <rect x="145" y="454" width="130" height="116" rx="30" fill="url(#ivory)"/>
    </g>
    <g>
      <rect x="558" y="175" width="184" height="170" rx="48" fill="url(#orange)"/>
      <rect x="585" y="202" width="130" height="116" rx="30" fill="url(#ivory)"/>
    </g>
    <g>
      <rect x="580" y="659" width="184" height="170" rx="48" fill="url(#orange)"/>
      <rect x="607" y="686" width="130" height="116" rx="30" fill="url(#ivory)"/>
    </g>
  </g>
</svg>
